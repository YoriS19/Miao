<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >
    <title>Miáo</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body data-page="daily-focus">

    <main class="main">

        <div class="item">

            <div>
                <h1>Daily Focus</h1>

                <p class="muted">
                    Choose up to 3 things to focus on today.
                </p>
            </div>

            <button class="btn" id="save">
                Save Focus
            </button>

        </div>

        <div class="two eq">

            <section class="card">

                <h2>My Focus</h2>

                <ul
                    class="list"
                    id="mine"
                ></ul>

            </section>

            <section class="card">

                <h2>Choose from your Tasks</h2>

                <div class="item">

                    <span class="muted">
                        Select up to 3 tasks
                    </span>

                    <b id="count"></b>

                </div>

                <p
                    class="err"
                    id="msg"
                    role="alert"
                ></p>

                <ul
                    class="list"
                    id="pick"
                ></ul>

            </section>

        </div>

    </main>

    <script src="js/app.js"></script>
    <script src="js/daily-focus.js"></script>

</body>

</html>
